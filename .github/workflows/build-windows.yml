name: Build Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: '3.44.9'
          architecture: x64
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Restore sqlite_vec source
        shell: pwsh
        run: |
          $archive = 'sqlite-vec-0.1.7-amalgamation.tar.gz'
          $url = "https://github.com/asg017/sqlite-vec/releases/download/v0.1.7/$archive"
          $expectedHash = 'FA0BBE5057414B587402536741178B65D18F5BF3DBB429BB3AAA7375AF2D3EE0'
          $tempDir = Join-Path $env:RUNNER_TEMP 'sqlite-vec'
          $archivePath = Join-Path $tempDir $archive
          $packageDir = Join-Path $env:LOCALAPPDATA 'Pub/Cache/hosted/pub.dev/sqlite_vec-0.1.7-alpha.3'
          $sourceDir = Join-Path $packageDir 'src'

          New-Item -ItemType Directory -Force -Path $tempDir, $sourceDir | Out-Null
          Invoke-WebRequest -Uri $url -OutFile $archivePath
          $actualHash = (Get-FileHash -Path $archivePath -Algorithm SHA256).Hash
          if ($actualHash -ne $expectedHash) {
            throw "sqlite-vec archive SHA-256 mismatch: $actualHash"
          }

          tar -xzf $archivePath -C $tempDir
          $source = Join-Path $tempDir 'sqlite-vec.c'
          $header = Join-Path $tempDir 'sqlite-vec.h'
          if (-not (Test-Path -LiteralPath $source -PathType Leaf) -or
              -not (Test-Path -LiteralPath $header -PathType Leaf)) {
            throw 'sqlite-vec amalgamation is missing required source files'
          }

          Copy-Item -Path $source, $header -Destination $sourceDir -Force

          $sqliteArchive = 'sqlite-amalgamation-3460100.zip'
          $sqliteUrl = "https://www.sqlite.org/2024/$sqliteArchive"
          $sqliteExpectedHash = '77823CB110929C2BCB0F5D48E4833B5C59A8A6E40CDEA3936B99E199DBBE5784'
          $sqliteArchivePath = Join-Path $tempDir $sqliteArchive
          Invoke-WebRequest -Uri $sqliteUrl -OutFile $sqliteArchivePath
          $sqliteActualHash = (Get-FileHash -Path $sqliteArchivePath -Algorithm SHA256).Hash
          if ($sqliteActualHash -ne $sqliteExpectedHash) {
            throw "SQLite amalgamation SHA-256 mismatch: $sqliteActualHash"
          }

          $sqliteDir = Join-Path $tempDir 'sqlite-amalgamation'
          Expand-Archive -Path $sqliteArchivePath -DestinationPath $sqliteDir
          $sqliteIncludeDir = Join-Path $sqliteDir 'sqlite-amalgamation-3460100'
          Copy-Item -Path (Join-Path $sqliteIncludeDir 'sqlite3.h'), (Join-Path $sqliteIncludeDir 'sqlite3ext.h') -Destination $sourceDir -Force

      - name: Generate Dart sources
        run: dart run build_runner build

      - name: Build Windows release
        run: flutter build windows --release --no-pub

      - name: Check release bundle
        run: |
          $bundle = 'build/windows/x64/runner/Release'
          foreach ($file in @('aetherlink_flutter.exe', 'flutter_windows.dll', 'data/app.so')) {
            if (-not (Test-Path -LiteralPath "$bundle/$file" -PathType Leaf)) {
              throw "Missing release file: $file"
            }
          }
          if (-not (Test-Path -LiteralPath "$bundle/data/flutter_assets" -PathType Container)) {
            throw 'Missing Flutter assets directory'
          }

      - name: Upload Windows bundle
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: Aetherlink-Windows-x64-${{ github.sha }}
          path: build/windows/x64/runner/Release/
          if-no-files-found: error
